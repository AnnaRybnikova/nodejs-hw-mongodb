openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description:
    This project is a Node.js-based REST API using MongoDB for data storage. 
    It includes user authentication, CRUD operations, and API documentation generated with Swagger. 
    The project follows best practices for structuring an Express.js application and integrating Swagger 
    for easy API exploration.
