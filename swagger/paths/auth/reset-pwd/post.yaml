tags:
  - Auth
summary: Reset password
operationId: reset-pwd
description: 'Reset password'
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            description: "User's token sent by email"
            type: string
            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NzljZDA2YTA0NzNhMGI2NTU1ZWRiMzIiLCJlbWFpbCI6InJ5Ym5pa292YS5hbm5hLjE4QGdtYWlsLmNvbSIsImlhdCI6MTczODM0MjQ0OSwiZXhwIjoxNzM4MzQyNzQ5fQ.TnLIl9k14kxbdloiO245fRmXcCvLv4wYhGXQnq6HI5g"
          password:
            description: "User's password"
            type: string
            example: "myPassword"

responses:
  '200':
    description: 'Password has been successfully reset.'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
              example: {}
  '400':
    $ref: '../../../components/responses/400.yaml'
  '401':
    $ref: '../../../components/responses/auth/401.yaml'